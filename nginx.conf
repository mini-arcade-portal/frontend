server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API calls to gareway
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed build assets (filename changes on every deploy) — safe to cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback — must always be revalidated, otherwise browsers can keep serving
    # a stale index.html that references a previous deploy's (now-gone) asset hashes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}